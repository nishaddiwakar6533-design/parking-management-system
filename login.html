<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEase - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <!-- Background Shapes -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>

        <!-- Login Card -->
        <div class="login-card">

            <!-- Logo Area -->
            <div class="logo-area">
                <div class="logo-icon">P</div>

                <div>
                    <div class="brand-name">ParkEase</div>
                    <div class="brand-tagline">Parking Management System</div>
                </div>
            </div>

            <h1>Welcome Back</h1>
            <p class="login-subtitle">Sign in to manage your parking</p>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">
    <label for="username">Username</label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        autocomplete="username"
        required
    >
</div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-button"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>

                <div id="loginMessage" class="login-message"></div>

            </form>

        

        </div>
        <!-- ===============================
     CREATE NEW USER MODAL
            ================================ -->

<div id="registerModal" class="register-modal">

    <div class="register-card">

        <button
            type="button"
            id="closeRegister"
            class="close-register"
        >
            ×
        </button>

        <div class="register-icon">
            P
        </div>

        <h2>Create New User</h2>

        <p class="register-subtitle">
            Create your ParkEase account
        </p>


        <!-- Registration Form -->

        <form id="registerForm">

            <!-- Full Name -->

            <div class="form-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Username -->

            <div class="form-group">

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="create-account-button"
            >
                Create Account
            </button>


            <div
                id="registerMessage"
                class="register-message"
            ></div>

        </form>

    </div>

</div>

    </div>

    <script src="login.js"></script>

</body>
</html>
